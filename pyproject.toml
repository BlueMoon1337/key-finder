[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyfinder"
version = "0.3.1"
description = "Practice tool for musicians: key, tempo and chord detection, stem separation, pitch and speed control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "av>=12",
    "numpy>=1.24",
    "scipy>=1.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Neural stem separation (Hybrid Transformer Demucs, keyfinder/neural.py). Pulls in PyTorch.
ml = ["demucs>=4.1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
# Freezes the desktop engine, Demucs included (packaging/engine.spec).
desktop = ["pyinstaller>=6.10", "demucs>=4.1"]

[project.scripts]
keyfinder = "keyfinder.cli:main"
keyfinder-engine = "keyfinder.engine:main"

[tool.setuptools.packages.find]
include = ["keyfinder*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI declares parameters with File()/Form()/Query() defaults by design.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
