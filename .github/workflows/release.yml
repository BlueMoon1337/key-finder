# Builds KeyFinder for macOS (Apple silicon and Intel, one app each: the analysis engine inside is
# native code) and Windows, signs the update files, and publishes them as a GitHub release that
# KeyFinder's Update button installs from. Adapted from Player's release workflow.
#
# Runs by itself when a push to main changes package.json (or this file) and its version hasn't
# been released yet; also when a version tag (v0.3.0) is pushed, or by hand from the Actions tab
# ("Run workflow"). To release, raise "version" in package.json (and pyproject.toml): KeyFinder
# only offers a release newer than itself, and a published version can't be reused.
#
# The release notes start with .github/release-notes.md (how to install), then list the changes.
#
# Updates: with the repository secret UPDATE_SIGNING_KEY (the Ed25519 private key whose public half
# is electron/update-key.pem; the same key pair as Player's, so Player's secret value works), the
# update files are signed and latest.json is published for the Update button. Without it the
# installers are still built and released, but the Update button won't find them.

name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: release
        name: Make a draft release, with install instructions and the changes since the last one as its notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::UPDATE_SIGNING_KEY isn't set: releasing the installers without signed update files, so the Update button won't offer this version. Add the secret (README ▸ Releases) for future releases."
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json's version ($tag)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "::notice::$tag is already released; nothing to do."
              exit 0
            fi
            echo "::error::$tag is already published. Raise the version in package.json."
            exit 1
          fi
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id" | head -n 1)"
          if [ -z "$id" ]; then
            previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | head -n 1 || true)"
            { cat .github/release-notes.md; echo "## Changes"; echo; git log --no-merges --pretty='- %s' ${previous:+$previous..}HEAD; } > notes.md
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
              -f name="KeyFinder $tag" -F draft=true -F body=@notes.md --jq .id)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: needs.release.outputs.id != ''
    env:
      HAS_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon Macs, built on GitHub's Apple silicon runner. It doesn't use macos-15-intel.
          - os: macos-latest
            platform: darwin-arm64
            dist: npm run dist:mac -- --arm64
          # Intel Macs only. Removing this entry stops the Intel build; Apple silicon builds are unaffected.
          - os: macos-15-intel
            platform: darwin-x64
            dist: npm run dist:mac -- --x64
          - os: windows-latest
            platform: win32-x64
            dist: npm run dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: npm ci
      - name: Freeze the analysis engine
        run: |
          python -m pip install -e ".[desktop]"
          npm run engine
        env:
          PYTHON: python
          # Intel Macs have no prebuilt wheel for sphn (a Demucs dependency), so it compiles; its
          # bundled Opus library declares an old CMake minimum that CMake 4 otherwise refuses.
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      - run: ${{ matrix.dist }}
        env:
          # No Apple / Windows certificates: macOS builds are ad-hoc signed (electron-builder.yml).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sign the update file
        if: env.HAS_KEY == 'true'
        run: node scripts/release.mjs sign ${{ matrix.platform }}
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      - name: Add the installers to the draft release
        run: node scripts/release.mjs upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
      - uses: actions/upload-artifact@v5
        if: env.HAS_KEY == 'true'
        with:
          name: signed-${{ matrix.platform }}
          path: release/update-${{ matrix.platform }}.json

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v5
        if: env.HAS_KEY == 'true'
        with:
          path: signed
      - name: Publish the release without update files (no UPDATE_SIGNING_KEY)
        if: env.HAS_KEY != 'true'
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
      - name: Add latest.json and publish the release
        if: env.HAS_KEY == 'true'
        run: node scripts/release.mjs publish signed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
          TAG: ${{ needs.release.outputs.tag }}
      # An update package (Profile ▸ Updates ▸ Install from Zip…) for when the Update button can't
      # be used. Extra: if it fails, the release is published all the same.
      - name: Add an update package
        continue-on-error: true
        run: |
          npm ci
          npm run update-package
          gh release upload "$TAG" release/KeyFinder-*-update.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
